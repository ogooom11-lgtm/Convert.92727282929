name: بناء نسخة ويندوز

on:
  push:
    branches: [main, "arena/**"]
  workflow_dispatch:

jobs:
  windows:
    name: بناء التطبيق (ويندوز)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: تنزيل الحزم
        run: flutter pub get

      - name: تحليل الكود
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: الاختبارات
        run: flutter test

      - name: بناء الإصدار
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          flutter build windows --release --verbose *> build-verbose.log
          $code = $LASTEXITCODE
          "=== exit: $code ===" | Out-File build-tail.txt
          Get-Content build-verbose.log -Tail 150 | Out-File build-tail.txt -Append
          Get-Content build-tail.txt
          Write-Output "::error::BUILD_EXIT_$code"


      - name: رفع الناتج
        uses: actions/upload-artifact@v4
        with:
          name: convert-windows-x64
          path: app/build/windows/x64/runner/Release/
          if-no-files-found: error
