name: بناء نسخة ويندوز

on:
  push:
    branches: [main, "arena/**"]
  workflow_dispatch:

jobs:
  windows:
    name: بناء التطبيق (ويندوز)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: تنزيل الحزم
        run: flutter pub get

      - name: تحليل الكود
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: الاختبارات
        run: flutter test

      - name: بناء الإصدار
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          flutter build windows --release --verbose *> build-verbose.log
          $code = $LASTEXITCODE
          New-Item -ItemType File -Path build-tail.txt -Force | Out-Null
          "=== exit: $code ===" | Out-File -FilePath build-tail.txt -Encoding utf8
          Get-Content build-verbose.log -Tail 150 | Out-File -FilePath build-tail.txt -Append -Encoding utf8
          Get-Content build-tail.txt
          Write-Output "::error::BUILD_EXIT_$code"


      # سجلات Actions محجوبة عن بعض الشبكات، لذا ننشر ملخص الفشل في تعليق
      # على الطلب حتى يبقى سبب الخطأ مقروءًا من صفحة GitHub.
      - name: نشر ملخص الفشل
        if: failure()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $fence = [char]0x0060 + [char]0x0060 + [char]0x0060
          $lines = @("### فشل بناء ويندوز", "", $fence)
          if (Test-Path build-tail.txt) {
            $tail = Get-Content build-tail.txt -Tail 120
            $lines += $tail
          } else {
            $lines += "لا يوجد سجل محفوظ."
          }
          $lines += $fence
          $lines | Out-File -Encoding utf8 pr-comment.md
          gh pr comment 1 --body-file pr-comment.md

      - name: رفع الناتج
        uses: actions/upload-artifact@v4
        with:
          name: convert-windows-x64
          path: app/build/windows/x64/runner/Release/
          if-no-files-found: error
