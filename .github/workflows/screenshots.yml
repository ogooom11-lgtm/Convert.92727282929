name: لقطات الواجهة

# يبني التطبيق على ويندوز، يفتحه فعليًا، يلتقط لقطات للشاشات الأربع،
# ثم يرفعها كأثر (artifact). يُشغَّل يدويًا أو عند تغيير هذا الملف.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/screenshots.yml

jobs:
  shots:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter build windows --release

      - name: تشغيل التطبيق والتقاط الشاشات
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $root = $env:GITHUB_WORKSPACE
          $out  = Join-Path $root "screenshots"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $screen = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          "screen: $($screen.Width)x$($screen.Height)" | Write-Output

          $exe = Join-Path $root "app\build\windows\x64\runner\Release\convert.exe"
          "exe exists: $(Test-Path $exe)" | Write-Output

          function Save-Shot($name) {
            $bmp = New-Object System.Drawing.Bitmap($screen.Width, $screen.Height)
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($screen.Location, [System.Drawing.Point]::Empty, $screen.Size)
            $bmp.Save((Join-Path $out $name), [System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose(); $bmp.Dispose()
            "saved $name" | Write-Output
          }

          $proc = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 15
          $running = Get-Process -Id $proc.Id -ErrorAction SilentlyContinue
          "app alive: $([bool]$running)" | Write-Output
          Save-Shot "00-initial.png"

          $wshell = New-Object -ComObject wscript.shell
          $null = $wshell.AppActivate($proc.Id)
          Start-Sleep -Milliseconds 800

          $shots = @(
            @{ key = "";   file = "01-workspace.png" },
            @{ key = "^2"; file = "02-queue.png" },
            @{ key = "^3"; file = "03-tools.png" },
            @{ key = "^4"; file = "04-settings.png" }
          )
          foreach ($shot in $shots) {
            if ($shot.key -ne "") { $wshell.SendKeys($shot.key); Start-Sleep -Seconds 3 }
            $null = $wshell.AppActivate($proc.Id)
            Start-Sleep -Milliseconds 700
            Save-Shot $shot.file
          }

          # النسخة الثانية يجب أن تُظهر النافذة القائمة لا تفتح ثانية.
          $before = (Get-Process convert -ErrorAction SilentlyContinue).Count
          $second = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 6
          $after = (Get-Process convert -ErrorAction SilentlyContinue).Count
          "instances before=$before after=$after" | Write-Output
          Get-Process convert -ErrorAction SilentlyContinue | Stop-Process -Force

          Get-ChildItem $out | ForEach-Object { "$($_.Name) $($_.Length) bytes" } | Write-Output
          "count=$((Get-ChildItem $out).Count)" | Add-Content $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: error
